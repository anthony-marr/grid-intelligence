[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-intelligence"
version = "0.1.0"
description = "Lakehouse pipeline over public US grid and nuclear fleet data: EIA-930 hourly grid data, NRC reactor status reports, and Open-Meteo weather in bronze/silver/gold layers (DuckDB + dbt), served through a dashboard and an MCP query layer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.0",
    "dbt-duckdb>=1.8",
    "httpx>=0.27",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyarrow>=14",
    "lxml>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grid-ingest = "grid_intelligence.ingest:main"
grid-server = "grid_intelligence.api:main"
grid-mcp-server = "grid_intelligence.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grid_intelligence = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
